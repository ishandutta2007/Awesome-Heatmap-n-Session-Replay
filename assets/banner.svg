<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Heatmap Radial Glows -->
    <radialGradient id="heatHot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="heatWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="heatCool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.75; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes sweepScan {
        0% { transform: translateX(0px); opacity: 0.1; }
        50% { opacity: 0.8; }
        100% { transform: translateX(420px); opacity: 0.1; }
      }
      @keyframes cursorMove {
        0% { transform: translate(750px, 190px); }
        25% { transform: translate(880px, 120px); }
        50% { transform: translate(1020px, 180px); }
        75% { transform: translate(920px, 240px); }
        100% { transform: translate(750px, 190px); }
      }
      @keyframes playProgress {
        0% { width: 40px; }
        100% { width: 380px; }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
        50% { transform: translateY(-12px) scale(1.2); opacity: 0.8; }
      }
      @keyframes heatPulse1 {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.25); opacity: 0.95; }
      }
      @keyframes heatPulse2 {
        0%, 100% { transform: scale(1.1); opacity: 0.85; }
        50% { transform: scale(0.9); opacity: 0.55; }
      }

      .pulse-1 { animation: heatPulse1 4s ease-in-out infinite; transform-origin: 920px 140px; }
      .pulse-2 { animation: heatPulse2 5s ease-in-out infinite; transform-origin: 1040px 220px; }
      .pulse-3 { animation: heatPulse1 4.5s ease-in-out infinite; transform-origin: 800px 210px; }
      .cursor-anim { animation: cursorMove 10s ease-in-out infinite; }
      .progress-bar { animation: playProgress 8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .scan-line { animation: sweepScan 6s linear infinite; }
      .particle-1 { animation: floatParticle 3.5s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 4.5s ease-in-out infinite 1s; }
      .particle-3 { animation: floatParticle 5s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="180" r="180" fill="#38bdf8" opacity="0.06" filter="url(#glow)" />
  <circle cx="950" cy="180" r="220" fill="#ec4899" opacity="0.08" filter="url(#glow)" />

  <!-- Left Side: Title & Info -->
  <g transform="translate(60, 50)">
    <!-- Badge -->
    <g transform="translate(0, 10)">
      <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#10b981" />
      <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">
        BEHAVIOR ANALYTICS
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" fill="url(#primaryTextGrad)" letter-spacing="-0.5">
      Awesome Heatmap &amp;
    </text>
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Session Replay 🔥
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Curated ecosystem of SaaS leaders &amp; top open-source projects
    </text>
    <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#64748b">
      Click &amp; Scroll Heatmaps • Session Recordings • Frustration Signals • Data Masking
    </text>

    <!-- Metric Tags -->
    <g transform="translate(0, 248)">
      <rect x="0" y="0" width="135" height="26" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <text x="10" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8">⚡ SaaS Leaders</text>

      <rect x="145" y="0" width="165" height="26" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      <text x="155" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#10b981">⭐ Top Open Source</text>

      <rect x="320" y="0" width="155" height="26" rx="6" fill="rgba(244, 63, 94, 0.1)" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1" />
      <text x="330" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#f43f5e">🎯 Pricing &amp; Limits</text>
    </g>
  </g>

  <!-- Right Side: Interactive UI Simulation (Heatmap + Session Player) -->
  <g transform="translate(680, 45)">
    <!-- Browser/App Frame -->
    <rect width="460" height="270" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect width="460" height="34" rx="12" fill="#1e293b" />
    <circle cx="20" cy="17" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="36" cy="17" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="52" cy="17" r="5" fill="#10b981" opacity="0.8" />
    <rect x="130" y="8" width="200" height="18" rx="4" fill="#0f172a" />
    <text x="175" y="21" font-family="monospace" font-size="10" fill="#64748b">app.session-replay.io</text>

    <!-- Webpage Content Wireframe inside App -->
    <rect x="20" y="50" width="90" height="16" rx="3" fill="#334155" opacity="0.6" />
    <rect x="20" y="75" width="220" height="10" rx="2" fill="#1e293b" />
    <rect x="20" y="92" width="180" height="10" rx="2" fill="#1e293b" />
    
    <!-- Interactive Cards Wireframe -->
    <rect x="20" y="115" width="130" height="85" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="160" y="115" width="130" height="85" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="300" y="115" width="140" height="85" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />

    <rect x="30" y="165" width="60" height="22" rx="4" fill="#3b82f6" opacity="0.7" />
    <rect x="170" y="165" width="60" height="22" rx="4" fill="#10b981" opacity="0.7" />
    <rect x="310" y="165" width="70" height="22" rx="4" fill="#f43f5e" opacity="0.7" />

    <!-- Heatmap Blobs (Dynamic Animated) -->
    <ellipse class="pulse-1" cx="205" cy="175" rx="65" ry="45" fill="url(#heatHot)" filter="url(#softGlow)" />
    <ellipse class="pulse-2" cx="350" cy="175" rx="75" ry="50" fill="url(#heatWarm)" filter="url(#softGlow)" />
    <ellipse class="pulse-3" cx="60" cy="175" rx="50" ry="35" fill="url(#heatCool)" filter="url(#softGlow)" />

    <!-- Replay Player Bar at Bottom of Frame -->
    <g transform="translate(20, 215)">
      <rect width="420" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      
      <!-- Play Button Icon -->
      <polygon points="18,16 18,26 28,21" fill="#38bdf8" />
      
      <!-- Timestamp -->
      <text x="36" y="25" font-family="monospace" font-size="10" fill="#94a3b8">02:14 / 04:30</text>
      
      <!-- Timeline Track -->
      <rect x="125" y="18" width="280" height="6" rx="3" fill="#334155" />
      <!-- Timeline Progress (Animated) -->
      <rect class="progress-bar" x="125" y="18" width="180" height="6" rx="3" fill="url(#accentGrad)" />
      
      <!-- Frustration Marker / Rage Click Dots on Timeline -->
      <circle cx="210" cy="21" r="4" fill="#f43f5e" stroke="#0f172a" stroke-width="1.5" />
      <circle cx="310" cy="21" r="4" fill="#eab308" stroke="#0f172a" stroke-width="1.5" />
    </g>

    <!-- Replay Live Badge -->
    <g transform="translate(370, 48)">
      <rect width="70" height="20" rx="4" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1" />
      <circle cx="380" cy="58" r="3.5" fill="#ef4444" />
      <text x="388" y="62" font-family="sans-serif" font-size="9" font-weight="700" fill="#ef4444">REPLAY</text>
    </g>

    <!-- Sweeping Scan Radar Bar -->
    <rect class="scan-line" x="20" y="45" width="4" height="165" fill="#38bdf8" opacity="0.4" filter="url(#glow)" />
  </g>

  <!-- Animated Pointer / Cursor -->
  <g class="cursor-anim">
    <path d="M 0 0 L 0 18 L 4.5 13.5 L 9 22 L 12 20.5 L 7.5 12 L 14 12 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5" filter="url(#softGlow)" />
    <!-- Click Ripple -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.8">
      <animate attributeName="r" values="0;24" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Sparkle Particles -->
  <circle class="particle-1" cx="620" cy="80" r="3" fill="#38bdf8" />
  <circle class="particle-2" cx="1140" cy="140" r="2.5" fill="#f43f5e" />
  <circle class="particle-3" cx="710" cy="310" r="3" fill="#10b981" />
</svg>
